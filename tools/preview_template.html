<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sub-Zero y Scorpion · Animaciones</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0e1622; color: #e4edf6 }
  body { max-width: 1100px; margin: 40px auto; padding: 0 20px }
  h1 { font-size: 25px; margin-bottom: 8px } p { color: #a9bed1 }
  .controls { display:flex; gap:16px; flex-wrap:wrap; align-items:center; margin:24px 0 }
  select, button { background:#243447; color:inherit; border:1px solid #506579; padding:8px 14px; border-radius:6px }
  .fighters { display:grid; grid-template-columns:1fr 1fr; gap:20px }
  article { background:#162232; padding:20px; border-radius:12px; border:1px solid #34475c }
  h2 { font-size:18px; color:#6dd6ff } article+article h2 { color:#ffd468 }
  .stage { height:250px; position:relative; overflow:hidden; background:repeating-conic-gradient(#192a3b 0% 25%,#1d3042 0% 50%) 50%/24px 24px; border-radius:6px }
  .floor { position:absolute; top:220px; width:100%; border-bottom:1px solid #92b5d3 }
  .actor { position:absolute; image-rendering:pixelated; transform-origin:50% 50% }
  .frames { display:flex; flex-wrap:wrap; gap:5px; margin-top:16px }
  .frames img { width:52px; height:52px; object-fit:contain; image-rendering:pixelated; border:1px solid #486178; background:#112031 }
  .info { font:13px monospace; color:#a9bed1; margin-top:12px }
  @media(max-width:700px) { .fighters { grid-template-columns:1fr } }
</style>
<h1>Sub-Zero y Scorpion</h1>
<p>Vista de los fotogramas importados en GameMaker. El juego se ejecuta desde MortalKombatRivals.yyp.</p>
<div class="controls">
  <label>Animación <select id="animation"></select></label>
  <label>Escala <select id="scale"><option value="0.65">Juego (65 %)</option><option value="1" selected>100 %</option><option value="1.25">125 %</option></select></label>
  <button id="pause">Pausar</button>
  <label><input id="mirror" type="checkbox"> Mirar a la izquierda</label>
  <label><input id="loop" type="checkbox" checked> Repetir</label>
</div>
<main class="fighters"></main>
<script>
const data = __SPRITE_DATA__;
const names = { stand:'Quieto', run:'Correr', jump_start:'Preparar salto', jump:'Saltar', fall:'Caer', land:'Aterrizar', punch:'Puñetazo', ranged:'Ataque a distancia', slide:'Deslizamiento / patada', hurt:'Recibir daño', death:'Morir', projectile:'Proyectil' };
const animation = document.querySelector('#animation');
for (const [key, label] of Object.entries(names)) animation.add(new Option(label, key));
const panels = ['subzero','scorpion'].map((character, index) => {
  const element = document.createElement('article');
  element.innerHTML = `<h2>${index ? 'SCORPION' : 'SUB-ZERO'}</h2><div class="stage"><div class="floor"></div><img class="actor" alt=""></div><div class="info"></div><div class="frames"></div>`;
  document.querySelector('main').append(element);
  return { character, element, actor: element.querySelector('.actor'), info: element.querySelector('.info') };
});
let elapsed = 0, previous = performance.now(), playing = true;
function setup() {
  elapsed = 0;
  for (const panel of panels) {
    panel.sprite = data.find(item => item.name === `s_${panel.character}_${animation.value}`);
    panel.element.querySelector('.frames').replaceChildren(...panel.sprite.frames.map((src, index) => {
      const img = new Image(); img.src = src; img.alt = `Fotograma ${index+1}`;
      img.onclick = () => { elapsed = index / panel.sprite.fps; playing = false; document.querySelector('#pause').textContent = 'Reanudar'; };
      return img;
    }));
  }
}
animation.onchange = setup;
document.querySelector('#pause').onclick = event => { playing = !playing; event.target.textContent = playing ? 'Pausar' : 'Reanudar'; };
function render(now) {
  if (playing) elapsed += Math.min((now - previous) / 1000, 0.1);
  previous = now;
  const scale = Number(document.querySelector('#scale').value);
  const mirror = document.querySelector('#mirror').checked;
  for (const panel of panels) {
    const sprite = panel.sprite;
    const raw = Math.floor(elapsed * sprite.fps);
    const frame = document.querySelector('#loop').checked ? raw % sprite.frames.length : Math.min(raw, sprite.frames.length - 1);
    if (panel.actor.getAttribute('src') !== sprite.frames[frame]) panel.actor.src = sprite.frames[frame];
    panel.actor.style.width = `${sprite.width * scale}px`;
    panel.actor.style.height = `${sprite.height * scale}px`;
    panel.actor.style.left = `calc(50% - ${sprite.origin[0] * scale}px)`;
    panel.actor.style.top = `${(animation.value === 'projectile' ? 145 : 220) - sprite.origin[1] * scale}px`;
    panel.actor.style.transform = mirror ? 'scaleX(-1)' : '';
    panel.info.textContent = `${sprite.name} · ${frame+1}/${sprite.frames.length} · ${sprite.fps} FPS`;
  }
  requestAnimationFrame(render);
}
setup(); requestAnimationFrame(render);
</script>
</html>
